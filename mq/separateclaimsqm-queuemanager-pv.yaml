kind: PersistentVolume
apiVersion: v1
metadata:
  name: separateclaimsqm-data-pv
spec:
  capacity:
    storage: 2Gi
  nfs:
    server: 192.168.1.70
    path: /pv/rwx03
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Delete
  volumeMode: Filesystem
  storageClassName: no-provisioner-sc
